name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install npm dependencies
        run: npm ci
        working-directory: web

      - name: Build wasm component
        run: make build

      - name: Transpile wasm component with jco
        run: npx jco transpile ../target/wasm32-wasip2/release/wasm_raytracer.wasm -o raytracer
        working-directory: web

      - name: Copy browser shim
        run: mkdir -p shim && cp node_modules/@bytecodealliance/preview2-shim/dist/browser/{cli,clocks,common,config,environment,io}.js shim/
        working-directory: web

      - name: Assemble dist
        run: make

      - uses: actions/configure-pages@v4

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
